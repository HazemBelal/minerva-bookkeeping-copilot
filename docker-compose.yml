services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - RUNS_DIR=/app/runs
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: "2gb"
    volumes:
      - ./data/runs:/app/runs
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
