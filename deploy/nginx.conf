server {
    listen 80;
    listen [::]:80;
    server_name srv1083267.hstgr.cloud;

    client_max_body_size 2m;

    # Task 2 set `compress: false` in next.config.ts, because Next's own gzip
    # buffers the SSE stream and the browser sees nothing. That switch is
    # global, so the Next container now serves ALL responses uncompressed and
    # nginx has to compress them instead. The /sse/ location below turns gzip
    # back off for streaming only.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /shots/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Streaming. Every directive here is load-bearing: with buffering or gzip
    # on, nginx holds the response and the live feed appears frozen.
    location /sse/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# This file is deliberately HTTP-only and references no cert files, so nginx
# starts cleanly on a box that has never run certbot (fresh provision, Task
# 11's final redeploy, disaster recovery). Once `certbot --nginx -d
# srv1083267.hstgr.cloud ...` has run, it rewrites the live
# /etc/nginx/conf.d/minerva.conf IN PLACE to add the 443 listeners, the
# ssl_certificate lines, and an 80->443 redirect -- deploy.sh is guarded (see
# the CERT check there) to never overwrite that certbot-owned file with this
# base again once a certificate exists, so re-running deploy.sh does not
# revert TLS to plain HTTP.
